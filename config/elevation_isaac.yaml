/elevation_mapping_node:
  ros__parameters:
    # FAST-LIO2 publishes map -> body; standalone.py publishes body -> base_link.
    map_frame: 'map'
    corrected_map_frame: 'map'
    base_frame: 'base_link'

    subscribers:
      lio_cloud:
        topic_name: '/fastlio2/body_cloud'
        data_type: pointcloud

    publishers:
      elevation_map_raw:
        layers: ['elevation', 'traversability', 'variance']
        basic_layers: ['elevation']
        fps: 5.0
      elevation_map_filter:
        layers: ['min_filter', 'smooth', 'inpaint', 'elevation']
        basic_layers: ['min_filter']
        fps: 3.0

    # Stair descent: keep cells observed from afar after they enter the lidar
    # blind zone. Ray-tracing / overlap clearing would erase them.
    enable_visibility_cleanup: false
    enable_overlap_clearance: false
