/elevation_mapping_node:
  ros__parameters:
    # FAST-LIO2 publishes map -> body; standalone.py publishes body -> base_link.
    map_frame: 'map'
    corrected_map_frame: 'map'
    base_frame: 'base_link'

    subscribers:
      lio_cloud:
        topic_name: '/fastlio2/body_cloud'
        data_type: pointcloud

    publishers:
      elevation_map_raw:
        layers: ['elevation', 'traversability', 'variance']
        basic_layers: ['elevation']
        fps: 5.0
      elevation_map_filter:
        layers: ['min_filter', 'smooth', 'inpaint', 'elevation']
        basic_layers: ['min_filter']
        fps: 3.0

    # Quadruped stair climbing: remove ghost points while keeping stairs seen
    # from afar after they enter the lidar blind zone.
    # Ray-tracing cleanup, softened: slow decay, short rays, ignore grazing rays.
    enable_visibility_cleanup: true
    max_ray_length: 3.0
    cleanup_step: 0.02
    cleanup_cos_thresh: 0.3
    # Drops cells further than overlap_clear_range_z from the sensor height
    # (removes tall spikes). Must exceed the height of a full flight of stairs.
    enable_overlap_clearance: true
    overlap_clear_range_xy: 4.0
    overlap_clear_range_z: 2.0
